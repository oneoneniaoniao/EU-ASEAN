<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EU-ASEAN サイト</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 10px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      h1 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 2em;
        text-align: center;
      }
      .description {
        margin-bottom: 30px;
        font-size: 1.1em;
        color: #555;
        text-align: center;
      }
      .link-button {
        display: block;
        text-align: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px 30px;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1.2em;
        font-weight: bold;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 20px;
      }
      .link-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>国際機関の世界地図</h1>
      <div class="description">
        <p>
          このサイトでは、G7、G20、EU、ASEAN、TPP、AU、SCOなどの国際機関の情報を
          インタラクティブな地図で確認できます。
        </p>
      </div>
      <a href="https://g7-zeta.vercel.app/" class="link-button" target="_blank" rel="noopener noreferrer" style="margin-top: 15px;">
        G7・G20の地図を開く →
      </a>
      <a href="eu-asean/index.html" class="link-button">
        G7・G20以外の地図を開く →
      </a>
    </div>
  </body>
</html>
